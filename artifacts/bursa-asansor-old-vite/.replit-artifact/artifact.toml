kind = "web"
previewPath = "/"
title = "Bursa Mobil Asansör Kiralama"
version = "1.0.0"
id = "artifacts/bursa-asansor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19555
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/bursa-asansor run dev"

[services.env]
PORT = "19555"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/bursa-asansor", "run", "build"]
publicDir = "artifacts/bursa-asansor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
